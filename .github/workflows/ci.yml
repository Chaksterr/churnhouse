# churnhouse CI: runs on every PR and on push to main.
#
#   job 1  lint      : ruff + dbt parse, no infra (~30 s)
#   job 2  dbt-build : boots a throwaway lakehouse (minio + catalog + trino),
#                      creates empty bronze tables via loader --schema-only,
#                      then dbt build = silver/gold models + all 35 tests.
#
# superset stays down; .env is copied from .env.example so that
# docker-compose.yml interpolation succeeds.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}        # one run per branch; a new push cancels the old one
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff + dbt parse)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: install dependencies
        run: uv sync --frozen

      - name: ruff
        run: uvx ruff check .

      - name: dbt parse
        run: uv run dbt parse --project-dir dbt --profiles-dir dbt --no-use-colors

  dbt-build:
    name: dbt build on a throwaway lakehouse
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: install dependencies
        run: uv sync --frozen

      - name: write .env from the template
        run: cp .env.example .env

      - name: start minio + iceberg catalog + trino (bucket is created on boot)
        run: docker compose up -d --wait --wait-timeout 300 minio iceberg-catalog trino

      - name: create empty bronze tables
        run: uv run python ingestion/load_bronze.py --schema-only

      - name: dbt build (silver + gold models, all tests)
        run: uv run dbt build --project-dir dbt --profiles-dir dbt --no-use-colors

      - name: container logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: upload dbt run results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-run-results
          path: dbt/target/run_results.json
          if-no-files-found: ignore
