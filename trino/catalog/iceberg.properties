# Trino ↔ Iceberg REST catalog ↔ MinIO wiring.
# ${ENV:...} means: read the variable from the trino container's environment
# (it is set by docker-compose.yml, which reads .env).

connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-catalog:8181
iceberg.rest-catalog.warehouse=s3://warehouse/

# lab-only: lets us expire snapshots / remove orphans immediately (Phase 7 maintenance DAG)
iceberg.expire-snapshots.min-retention=0s
iceberg.remove-orphan-files.min-retention=0s

# native S3 file system for reading/writing the Parquet files
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:MINIO_USER}
s3.aws-secret-key=${ENV:MINIO_PASSWORD}
