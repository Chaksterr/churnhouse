# churnhouse — the lakehouse core
# 3 services: disk (MinIO) → catalog (Iceberg REST) → SQL window (Trino)
# Your credentials come from .env (same folder).
# NOTE: the `warehouse` bucket is created MANUALLY once, via the MinIO web console
# (http://localhost:9001 → Object Browser → Create Bucket → name: warehouse).

services:
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

  # the "address book": every tool asks it which tables exist and where their files are
  iceberg-catalog:
    image: tabulario/iceberg-rest:latest
    container_name: iceberg-catalog
    depends_on: [minio]
    ports: ["8181:8181"]
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_PASSWORD}
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"

  # the SQL window over the tables
  trino:
    image: trinodb/trino:470
    container_name: trino
    depends_on: [iceberg-catalog]
    ports: ["8080:8080"]
    environment:
      MINIO_USER: ${MINIO_USER}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
    volumes: ["./trino/catalog:/etc/trino/catalog"]

volumes:
  minio-data:
