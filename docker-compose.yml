# churnhouse lakehouse: minio (disk) + iceberg REST catalog (address book) + trino (SQL)
# creds come from .env | bucket `warehouse` is created by hand in the console (:9001)

services:
  # disk: S3-style storage. data lives in the minio-data volume.
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: minio
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}        # bitnami names them MINIO_ROOT_*
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
      MINIO_API_PORT_NUMBER: "9000"
      MINIO_CONSOLE_PORT_NUMBER: "9001"
      MINIO_BROWSER: "on"                   # bitnami quirk: console is OFF without this
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/bitnami/minio/data]

  # knows which tables exist and where the metadata files are
  iceberg-catalog:
    image: tabulario/iceberg-rest:latest
    container_name: iceberg-catalog
    depends_on: [minio]
    ports: ["8181:8181"]
    user: root    # needed only so sqlite can create /data/iceberg.db in a fresh named volume
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_PASSWORD}
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000      # MinIO, not real AWS
      CATALOG_S3_PATH__STYLE__ACCESS: "true"      # MinIO answer: yes path-style authentication
      CATALOG_URI: jdbc:sqlite:file:/data/iceberg.db   # registry on a volume (default /tmp + memory = lost every restart)
    volumes: [catalog-metastore:/data]
  # SQL engine: dlt loads through it, dbt runs through it, superset reads through it
  trino:
    image: trinodb/trino:470
    container_name: trino
    depends_on: [iceberg-catalog]
    ports: ["8080:8080"]
    environment:
      MINIO_USER: ${MINIO_USER}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
    volumes: ["./trino/catalog:/etc/trino/catalog"]   # our iceberg.properties is the config

  # the showcase: BI app that reads gold through the same trino
  superset:
    build: ./superset                # lean superset image + sqlalchemy-trino driver
    image: churnhouse-superset:6.1.0-trino
    container_name: superset
    depends_on: [trino]
    ports: ["8088:8088"]
    env_file: .env                   # SUPERSET_SECRET_KEY comes from the root .env
    environment:
      SUPERSET_LOAD_EXAMPLES: "no"   # we have real data - no demo dashboards
    volumes: [superset-data:/app/superset_home]   # settings + metadata survive restarts

volumes:
  minio-data:
  catalog-metastore:   # iceberg REST catalog keeps its sqlite registry here
  superset-data:
